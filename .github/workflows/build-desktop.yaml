name: Build Desktop App

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true
  push:
    tags:
      - "v*"
    branches:
      - dev
      - feature/desktop-app
    paths:
      - "packages/desktop/**"
      - "packages/core/**"
      - "packages/db/**"
      - ".github/workflows/build-desktop.yaml"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create renderer .env
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> packages/desktop/renderer/.env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> packages/desktop/renderer/.env
          echo "VITE_PUBLIC_URL=${{ secrets.VITE_PUBLIC_URL }}" >> packages/desktop/renderer/.env

      - name: Build and package (macOS)
        working-directory: packages/desktop
        env:
          APP_URL: ${{ secrets.VITE_PUBLIC_URL }}
        run: pnpm run dist:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: |
            packages/desktop/build/*.dmg
            packages/desktop/build/*.zip
          if-no-files-found: error

  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create renderer .env
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> packages/desktop/renderer/.env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> packages/desktop/renderer/.env
          echo "VITE_PUBLIC_URL=${{ secrets.VITE_PUBLIC_URL }}" >> packages/desktop/renderer/.env

      - name: Build and package (Windows)
        working-directory: packages/desktop
        env:
          APP_URL: ${{ secrets.VITE_PUBLIC_URL }}
        run: pnpm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-win
          path: packages/desktop/build/*.exe
          if-no-files-found: error

  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-mac
          path: release-files

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-win
          path: release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: release-files/*
          generate_release_notes: true
