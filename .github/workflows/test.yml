name: Tests

on:
  push:
    branches: ["**"]
    paths:
      - "packages/core/**"
      - ".github/workflows/test.yml"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "packages/core/**"
      - ".github/workflows/test.yml"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"

jobs:
  test-core:
    name: Core unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter @stretch4paws/core test
