<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stretch4Paws</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #6fc3ba;
        font-family: system-ui, -apple-system, sans-serif;
        user-select: none;
        overflow: hidden;
      }

      .logo {
        width: 72px;
        height: 72px;
        margin-bottom: 20px;
        animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }

      .name {
        font-size: 22px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: -0.3px;
        animation: fadein 0.4s 0.15s ease both;
      }

      .loader {
        margin-top: 32px;
        width: 36px;
        height: 4px;
        border-radius: 2px;
        background: rgba(0, 0, 0, 0.08);
        overflow: hidden;
        animation: fadein 0.4s 0.25s ease both;
      }

      .loader::after {
        content: '';
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 2px;
        background: #6fc3ba;
        animation: slide 1s ease-in-out infinite;
      }

      @keyframes pop {
        from { opacity: 0; transform: scale(0.7); }
        to   { opacity: 1; transform: scale(1); }
      }

      @keyframes fadein {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @keyframes slide {
        0%   { transform: translateX(-100%); }
        50%  { transform: translateX(150%); }
        100% { transform: translateX(150%); }
      }

      @media (prefers-color-scheme: dark) {
        body { background-color: #6fc3ba; }
        .name { color: #ffffff; }
        .loader { background: rgba(255, 255, 255, 0.08); }
      }
    </style>
  </head>
